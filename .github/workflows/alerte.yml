name: Alerte logement

on:
  schedule:
    - cron: "*/10 5-22 * * *"   # toutes les 10 min, de 7h à minuit (heure suisse, été)
  workflow_dispatch:            # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write               # pour enregistrer vus.json

concurrency:
  group: alerte-logement
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Chercher les nouvelles annonces
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerte.py

      - name: Mémoriser les annonces vues
        run: |
          git config user.name "alerte-logement"
          git config user.email "actions@users.noreply.github.com"
          git add vus.json
          git diff --cached --quiet || (git commit -m "annonces vues" && git pull --rebase && git push)
